<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本格闘技選手図鑑</title>
<meta name="description" content="日本の格闘技選手をまとめた図鑑サイト">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ef; --surface:#ffffff; --text:#1b1b1f; --muted:#6b6b75; --line:#e2dfd8;
  --accent:#c8102e; --chip:#ece9e2;
  --c-box:#c8102e; --c-kick:#e07a00; --c-mma:#1f5fbf; --c-judo:#2e8b57; --c-wrestle:#7b3fbf; --c-other:#555;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121215; --surface:#1c1c21; --text:#f1f1f3; --muted:#a0a0aa; --line:#2c2c33; --chip:#26262d;
  }
}
:root[data-theme="dark"]{
  --bg:#121215; --surface:#1c1c21; --text:#f1f1f3; --muted:#a0a0aa; --line:#2c2c33; --chip:#26262d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP",system-ui,sans-serif;line-height:1.6}
header{background:var(--text);color:var(--bg);padding:40px 16px 32px;text-align:center}
header h1{margin:0;font-size:clamp(28px,6vw,48px);font-weight:900;letter-spacing:.05em}
header h1 span{color:var(--accent)}
header p{margin:8px 0 0;opacity:.75;font-size:14px}
main{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
.controls{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
#search{width:100%;padding:12px 16px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:none;padding:6px 14px;border-radius:999px;background:var(--chip);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.chip.active{background:var(--accent);color:#fff}
.count{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;font:inherit;color:inherit;padding:0}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.avatar{height:140px;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;color:#fff;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.card-body{padding:14px 16px 16px}
.card-body h2{margin:0;font-size:18px}
.card-body .kana{font-size:12px;color:var(--muted)}
.tag{display:inline-block;margin-top:8px;padding:2px 10px;border-radius:999px;font-size:12px;color:#fff}
.nick{font-size:13px;color:var(--muted);margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
dialog{border:none;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 32px);background:var(--surface);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.modal-head{padding:28px 24px 20px;color:#fff}
.modal-head h2{margin:0;font-size:26px}
.modal-head .kana{opacity:.85;font-size:13px}
.modal-body{padding:20px 24px 24px}
.modal-body table{width:100%;border-collapse:collapse;font-size:14px}
.modal-body th{text-align:left;color:var(--muted);font-weight:400;width:34%;padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.modal-body td{padding:8px 0;border-bottom:1px solid var(--line)}
.modal-body p{font-size:14px;margin:16px 0 0}
.close{float:right;background:rgba(255,255,255,.2);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 40px}
</style>
</head>
<body>
<header>
  <h1>日本<span>格闘技</span>選手図鑑</h1>
  <p>JAPAN FIGHTERS ENCYCLOPEDIA</p>
</header>

<main>
  <div class="controls">
    <input id="search" type="search" placeholder="名前・ニックネーム・出身地で検索">
    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="modal"></dialog>

<footer>© 日本格闘技選手図鑑 ／ 掲載情報は作成時点のものです</footer>

<script>
/* =========================================================
   ▼▼▼ 選手データ（ここを編集・追加するだけでOK） ▼▼▼
   ・1人分を { ... }, の形でコピーして増やせます
   ・photo に画像ファイル名（例: "images/inoue.jpg"）を書くと写真が出ます
     ※写真は自分で撮影したもの・使用許可のあるものだけにしてください
   ・record（戦績）は最新情報を確認して記入してください
   ========================================================= */
const FIGHTERS = [
  {
    name: "井上 尚弥", kana: "いのうえ なおや", sport: "ボクシング",
    nickname: "モンスター", born: "1993年4月10日", hometown: "神奈川県座間市",
    style: "オーソドックス", record: "", photo: "",
    note: "複数階級で世界王座を獲得した日本ボクシング界の第一人者。"
  },
  {
    name: "那須川 天心", kana: "なすかわ てんしん", sport: "ボクシング",
    nickname: "神童", born: "1998年8月18日", hometown: "千葉県松戸市",
    style: "サウスポー", record: "", photo: "",
    note: "キックボクシングで無敗の活躍後、プロボクシングへ転向。"
  },
  {
    name: "堀口 恭司", kana: "ほりぐち きょうじ", sport: "MMA",
    nickname: "", born: "1990年10月12日", hometown: "群馬県高崎市",
    style: "伝統派空手ベース", record: "", photo: "",
    note: "空手仕込みのスピードと踏み込みで国内外の団体で活躍。"
  },
  {
    name: "朝倉 未来", kana: "あさくら みくる", sport: "MMA",
    nickname: "", born: "1992年7月24日", hometown: "愛知県豊橋市",
    style: "", record: "", photo: "",
    note: "RIZINを中心に活躍。YouTubeでも高い人気を持つ。"
  },
  {
    name: "武尊", kana: "たける", sport: "キックボクシング",
    nickname: "ナチュラル・ボーン・クラッシャー", born: "1991年7月29日", hometown: "鳥取県米子市",
    style: "", record: "", photo: "",
    note: "K-1で3階級制覇を達成したキックボクシングの象徴的存在。"
  }
];
/* ▲▲▲ 選手データここまで ▲▲▲ */

const SPORT_COLORS = {
  "ボクシング":"var(--c-box)", "キックボクシング":"var(--c-kick)", "MMA":"var(--c-mma)",
  "柔道":"var(--c-judo)", "レスリング":"var(--c-wrestle)"
};
const colorOf = s => SPORT_COLORS[s] || "var(--c-other)";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let currentSport = "すべて";
const sports = ["すべて", ...new Set(FIGHTERS.map(f => f.sport))];

const chipsEl = document.getElementById("chips");
const gridEl = document.getElementById("grid");
const countEl = document.getElementById("count");
const searchEl = document.getElementById("search");
const modal = document.getElementById("modal");

function renderChips(){
  chipsEl.innerHTML = sports.map(s =>
    `<button class="chip ${s===currentSport?"active":""}" data-s="${esc(s)}">${esc(s)}</button>`).join("");
}
chipsEl.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  currentSport = b.dataset.s; renderChips(); render();
});
searchEl.addEventListener("input", render);

function avatar(f, big){
  const initial = f.name.replace(/\s/g,"").charAt(0);
  const img = f.photo ? `<img src="${esc(f.photo)}" alt="${esc(f.name)}">` : "";
  return `<div class="avatar" style="background:${colorOf(f.sport)}${big?";height:180px":""}">${esc(initial)}${img}</div>`;
}

function render(){
  const q = searchEl.value.trim().toLowerCase();
  const list = FIGHTERS.filter(f =>
    (currentSport==="すべて" || f.sport===currentSport) &&
    (!q || [f.name,f.kana,f.nickname,f.hometown].join(" ").toLowerCase().includes(q))
  );
  countEl.textContent = `${list.length} 人を表示中`;
  gridEl.innerHTML = list.length ? list.map(f => `
    <button class="card" data-i="${FIGHTERS.indexOf(f)}">
      ${avatar(f)}
      <div class="card-body">
        <h2>${esc(f.name)}</h2>
        <div class="kana">${esc(f.kana)}</div>
        ${f.nickname?`<div class="nick">「${esc(f.nickname)}」</div>`:""}
        <span class="tag" style="background:${colorOf(f.sport)}">${esc(f.sport)}</span>
      </div>
    </button>`).join("") : `<div class="empty">該当する選手がいません</div>`;
}

gridEl.addEventListener("click", e => {
  const c = e.target.closest(".card"); if(!c) return;
  const f = FIGHTERS[c.dataset.i];
  const rows = [["競技",f.sport],["ニックネーム",f.nickname],["生年月日",f.born],["出身地",f.hometown],["スタイル",f.style],["戦績",f.record]]
    .filter(r => r[1]).map(r => `<tr><th>${r[0]}</th><td>${esc(r[1])}</td></tr>`).join("");
  modal.innerHTML = `
    <div class="modal-head" style="background:${colorOf(f.sport)}">
      <button class="close" aria-label="閉じる">×</button>
      <h2>${esc(f.name)}</h2><div class="kana">${esc(f.kana)}</div>
    </div>
    <div class="modal-body"><table>${rows}</table>${f.note?`<p>${esc(f.note)}</p>`:""}</div>`;
  modal.showModal();
});
modal.addEventListener("click", e => {
  if(e.target===modal || e.target.closest(".close")) modal.close();
});

renderChips(); render();
</script>
</body>
</html>
