# 検索エンジン向けの静的ページ（/fighters/{key}/ など）とサイトマップを作り直す
name: Site pages
on:
  push:
    branches: [main]
    paths: ["index.html", "data/**", "tools/pages/**", "data-src/site.json"]
  schedule:
    - cron: "17 21 * * *"        # 毎日 6:17（日本時間）。自動更新で変わったデータも反映
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tools/pages/build.js
      - name: コミット
        run: |
          git add -A index.html 404.html sitemap-pages.xml sitemap.xml robots.txt fighters gyms rankings champions events stats cards about privacy contact compare create me admin login reset predict/index.html
          if git diff --cached --quiet; then echo "変化なし"; exit 0; fi
          # 別の自動処理と push がぶつかったら、最新の main に合わせて作り直して最大3回やり直す
          for i in 1 2 3; do
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "検索向けページを更新" || true
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then echo "push 完了"; exit 0; fi
            echo "push がぶつかったので作り直します（${i}回目）"
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            node tools/pages/build.js
            git add -A index.html 404.html sitemap-pages.xml sitemap.xml robots.txt fighters gyms rankings champions events stats cards about privacy contact compare create me admin login reset predict/index.html
            if git diff --cached --quiet; then echo "変化なし"; exit 0; fi
            sleep $((i * 5))
          done
          exit 1
