# 週次データ更新：毎週月曜 5:00（日本時間）に外部データを確認し、変更があれば Pull Request を作る
#   ・自動取得：Wikipedia（試合結果）、Wikidata（プロフィール・SNSの参考候補）、RIZIN公式サイトマップ（新着URLのみ）
#   ・既存に無い大会で曖昧な点が無いものだけを data-src/events に追加し、既存の tools/build_fights.py で data/fights.js を再生成
#   ・訂正候補・SNS候補などは data-src/sync/review.json（要確認リスト）に出すだけで自動反映しない
#   ・変更が無ければ PR を作らない／同じ内容の PR を重複して作らない（専用ブランチを1本だけ使う）
#   ・テスト・検証に失敗したら何もコミットしない（main は一切変更しない）
# 事前設定：Settings → Actions → General → Workflow permissions で
#   「Allow GitHub Actions to create and approve pull requests」にチェック
name: Weekly data update

on:
  schedule:
    - cron: "0 20 * * 0"   # UTC 日曜20:00 ＝ 日本時間 月曜5:00
  workflow_dispatch: {}

permissions:
  contents: write          # 更新用ブランチへの push
  pull-requests: write     # PR の作成・本文更新

concurrency:
  group: weekly-data-update
  cancel-in-progress: false

env:
  BRANCH: auto/weekly-data-update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test (sync / regression)
        run: |
          python3 -m unittest discover -s tools/sync/tests -v
          python3 -m unittest discover -s tools/gyms -p 'test_*.py' -v
          node --test tools/social/fetch.test.mjs

      - name: Check data and prepare updates
        id: sync
        run: |
          set -o pipefail
          python3 tools/sync/run.py --out sync-out
          # 所属ジム：Wikipedia の選手記事から所属欄を取り直し、data/gyms.js を作り直す（失敗しても既存データは残す）
          if python3 tools/gyms/collect.py && python3 tools/gyms/build.py; then echo "gyms updated"; else git checkout -- data-src/gyms data/gyms.js; echo "::warning::所属ジムの更新に失敗しました（既存データを維持）"; fi
          if [ -z "$(git status --porcelain -- data-src data/fights.js data/profiles.js data/gyms.js)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "データの変更はありません。PRは作成しません。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git status --short

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: sync-out/
          retention-days: 90

      - name: Create or update pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "fightbook-weekly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data-src data/fights.js data/profiles.js data/gyms.js
          git commit -m "週次データ更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          # 既に同じ内容のブランチがあれば何もしない（重複PR・無駄な更新を防ぐ）
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            if git diff --quiet "origin/$BRANCH" HEAD -- data-src data/fights.js data/profiles.js data/gyms.js; then
              echo "同じ内容の更新ブランチが既にあります。PRは作成しません。" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          git push --force origin "$BRANCH"
          head -c 60000 sync-out/report.md > pr-body.md
          printf '\n\n---\nこのPRは週次バッチ（weekly-update.yml）が自動作成しました。内容を確認してマージすると GitHub Pages に反映されます。\n' >> pr-body.md
          PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --body-file pr-body.md --title "週次データ更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            echo "PR #$PR を更新しました" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base main --head "$BRANCH" --title "週次データ更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)" --body-file pr-body.md
          fi
