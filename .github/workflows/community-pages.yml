# ファンの対戦カードごとの共有ページ（/matchups/{id}/）・共有画像・サイトマップを作る
# 公開キーで公開データだけを読み、変化があったカードだけを作り直してコミットする。
name: Community pages
on:
  schedule:
    - cron: "*/10 * * * *"       # 約10分ごと（GitHub の混雑で遅れることがあります）
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "tools/community/**", "js/community-config.js"]
permissions:
  contents: write
concurrency:
  group: community-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 取得
        id: fetch
        run: |
          set +e
          python3 tools/community/fetch_cards.py /tmp/cards.json /tmp/events.json
          code=$?
          if [ $code -eq 3 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      # 日本語フォントは一度入れたらキャッシュして使い回す（apt-get が混雑で止まり、10分で打ち切られることがあったため）
      - name: 日本語フォント（キャッシュ）
        if: steps.fetch.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: ~/.fonts-fb
          key: noto-cjk-black-v1
      - name: 日本語フォントと画像ライブラリ
        if: steps.fetch.outputs.skip != '1'
        run: |
          mkdir -p ~/.fonts-fb
          if [ ! -s ~/.fonts-fb/NotoSansCJK-Black.ttc ]; then
            for i in 1 2 3; do
              if timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk >/dev/null; then break; fi
              echo "フォントの取得をやり直します（${i}回目）"; sleep 10
            done
            cp /usr/share/fonts/opentype/noto/NotoSansCJK-Black.ttc ~/.fonts-fb/ 2>/dev/null || cp /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc ~/.fonts-fb/NotoSansCJK-Black.ttc
          fi
          pip install -q pillow
      - name: ページを作る
        if: steps.fetch.outputs.skip != '1'
        run: |
          node tools/community/dump_names.js > /tmp/names.json
          python3 tools/community/build_pages.py --cards /tmp/cards.json --names /tmp/names.json --events /tmp/events.json
      - name: コミット
        if: steps.fetch.outputs.skip != '1'
        run: |
          git add -A matchups predict sitemap-cards.xml data-src/community || true
          if git diff --cached --quiet; then echo "変化なし"; exit 0; fi
          # 同じ時間に別の自動処理（検索向けページの更新など）がコミットすると push がぶつかることがある。
          # ぶつかったら最新の main に合わせてページを作り直し、最大3回までやり直す
          for i in 1 2 3; do
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "共有ページを更新" || true
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then echo "push 完了"; exit 0; fi
            echo "push がぶつかったので作り直します（${i}回目）"
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/community/build_pages.py --cards /tmp/cards.json --names /tmp/names.json --events /tmp/events.json
            git add -A matchups predict sitemap-cards.xml data-src/community || true
            if git diff --cached --quiet; then echo "変化なし"; exit 0; fi
            sleep $((i * 5))
          done
          exit 1
