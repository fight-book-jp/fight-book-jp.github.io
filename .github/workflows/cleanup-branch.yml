# 一時的：調査用ブランチを削除する（実行後にこのファイルも削除します）
name: Cleanup probe branch
on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-branch.yml"]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push origin --delete gyms-probe || echo "already deleted"
