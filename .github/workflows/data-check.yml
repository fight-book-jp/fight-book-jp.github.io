# 試合データの検証と再生成
#   ・PR / push のたびに data-src を検証し、テストを実行
#   ・main に data-src の変更が入ったら tools/build_fights.py で data/fights.js を作り直し、差分があればコミット
#     （週次PRには生成済みの fights.js が入っているので通常は差分なし。手で data-src を直した場合の生成漏れを防ぐ）
name: Data check

on:
  push:
    branches: [main]
    paths:
      - "data-src/**"
      - "!data-src/community/**"
      - "tools/build_fights.py"
      - "tools/sync/**"
      - "tools/gyms/**"
      - "data/fighters.js"
      - "data/profiles.js"
      - ".github/workflows/data-check.yml"
  pull_request:
    paths:
      - "data-src/**"
      - "tools/build_fights.py"
      - "tools/sync/**"
      - "data/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate
        run: python3 tools/sync/validate.py
      - name: Test
        run: |
          python3 -m unittest discover -s tools/sync/tests
          python3 -m unittest discover -s tools/gyms -p 'test_*.py'
      - name: Rebuild gyms.js
        run: python3 tools/gyms/build.py
      - name: Rebuild fights.js
        run: python3 tools/build_fights.py
      - name: Fail if fights.js is stale (pull request)
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- data/fights.js data/gyms.js || (echo "::error::data/fights.js が data-src と一致しません。python3 tools/build_fights.py を実行してください"; exit 1)
      - name: Commit regenerated fights.js (main)
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/fights.js data/gyms.js; then echo "fights.js / gyms.js は最新です"; exit 0; fi
          git config user.name "fightbook-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fights.js data/gyms.js
          git commit -m "data/fights.js・data/gyms.js を再生成"
          git pull --rebase --autostash origin main
          git push
